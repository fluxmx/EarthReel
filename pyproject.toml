[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "earthreel"
version = "0.1.0.dev0"
description = "Turn Earth science data into cinematic globe animations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "xarray>=2024.10",
  "netCDF4>=1.7.2",
  "pyvista>=0.46,<0.50",
  "PyYAML>=6.0.2",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.6,<0.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
earthreel = "earthreel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
grib = ["cfgrib>=0.9.15", "eccodes>=2.43"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: requires an OpenGL rendering context"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
earthreel = ["assets/*.png", "assets/*.svg", "assets/*.md", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

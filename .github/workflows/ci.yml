name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install '.[dev,grib]'
      - name: Check CLI entry points
        run: |
          earthreel --help
          earthreel --version
          python -m earthreel --version
      - name: Lint
        run: ruff check .
      - name: Test data and configuration
        run: pytest -m 'not render'

  render:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      EARTHREEL_RENDER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install rendering environment
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libopengl0
          python -m pip install '.[dev,grib]'
      - name: Render and decode synthetic test products
        run: xvfb-run -a pytest -m render
      - name: Render bundled ERA5 data
        run: |
          xvfb-run -a earthreel snapshot examples/era5_t2m.yml --output outputs/ci-era5.png --width 480 --height 270
          xvfb-run -a earthreel render examples/era5_t2m.yml --output outputs/ci-era5.mp4 --width 480 --height 270 --fps 3 --duration 2 --time-index 2
          xvfb-run -a earthreel snapshot examples/era5_t2m.yml --layout single --output outputs/ci-era5-single.png --width 480 --height 270
      - uses: actions/upload-artifact@v4
        with:
          name: era5-render-smoke
          path: outputs/ci-era5*
          retention-days: 7
